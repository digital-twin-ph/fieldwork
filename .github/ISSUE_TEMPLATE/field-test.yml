name: Field test finding
description: What happened when Fieldwork was used on a real task in the field. One issue per finding.
title: "[Field test] "
labels: ["field-test"]
body:
  - type: markdown
    attributes:
      value: One finding per issue. Say what you were trying to do, what happened, and what you expected. Never paste personal or identifiable data.
  - type: textarea
    id: task
    attributes:
      label: The task
      description: What you were trying to do, and why
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: The steps, in order
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: example
    attributes:
      label: Project or worked example
      description: Which one, if any, e.g. Measles in Sierra Leone
  - type: input
    id: version
    attributes:
      label: Fieldwork version
    validations:
      required: true
  - type: input
    id: tester
    attributes:
      label: Tester
      description: Your name or GitHub login
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, device and connection
      description: e.g. Chrome on an Android phone, slow mobile data
