name: Live services check

# THE OUTSIDE SERVICES, CHECKED WHEN NOTHING IS PUSHED (docs/audits/gating-audit.md, decided 2026-11-19). The local gate
# answers geoBoundaries from recorded copies; the verify job in pages.yml has none, so every push is already checked
# against the live services. A service can change with no change of ours, so this runs the browser tests against them
# weekly, Sunday at 05:00 UTC (midnight in New York in winter, 1 a.m. in summer), and on demand, with the sentence check
# for the workflows that read satellite files from Planetary Computer, which the gate leaves to it. A failure opens an
# issue, or adds to the open one, naming the tests that failed. It never blocks a release.
on:
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FIELDWORK_LIVE: '1'
      FIELDWORK_BROWSERS: chromium
      FIELDWORK_WORKERS: '2'
    steps:
      - uses: actions/checkout@v6
      # The pinned repositories the browser tests read beside this one, as verify places them.
      - id: pins
        run: |
          pin(){ jq -r ".examples[] | select(.repository|endswith(\"/$1\")) | .commit" widgets/examples.json; }
          {
            echo "lab=$(jq -r .lab.commit widgets/parity.json)"
            echo "deeper=$(jq -r .repository.commit widgets/dive-deeper.json)"
            echo "southlondon=$(pin example-1855-cholera-south-london)"
            echo "oswego=$(pin example-1940-oswego-church-supper)"
            echo "nigeria=$(pin example-2024-nigeria-immunization)"
            echo "nyc=$(pin example-2025-nyc-ozone)"
            echo "salmonella=$(pin example-2021-salmonella-germany)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with: {repository: digital-twin-ph/validation-lab, ref: '${{ steps.pins.outputs.lab }}', fetch-depth: 0, path: validation-lab-checkout}
      - uses: actions/checkout@v6
        with: {repository: digital-twin-ph/dive-deeper, ref: '${{ steps.pins.outputs.deeper }}', fetch-depth: 0, path: dive-deeper-checkout}
      - uses: actions/checkout@v6
        with: {repository: digital-twin-ph/example-1855-cholera-south-london, ref: '${{ steps.pins.outputs.southlondon }}', fetch-depth: 0, path: example-south-london-checkout}
      - uses: actions/checkout@v6
        with: {repository: digital-twin-ph/example-1940-oswego-church-supper, ref: '${{ steps.pins.outputs.oswego }}', fetch-depth: 0, path: example-oswego-checkout}
      - uses: actions/checkout@v6
        with: {repository: digital-twin-ph/example-2024-nigeria-immunization, ref: '${{ steps.pins.outputs.nigeria }}', fetch-depth: 0, path: example-nigeria-checkout}
      - uses: actions/checkout@v6
        with: {repository: digital-twin-ph/example-2025-nyc-ozone, ref: '${{ steps.pins.outputs.nyc }}', fetch-depth: 0, path: example-nyc-checkout}
      - uses: actions/checkout@v6
        with: {repository: digital-twin-ph/example-2021-salmonella-germany, ref: '${{ steps.pins.outputs.salmonella }}', fetch-depth: 0, path: example-salmonella-checkout}
      - uses: actions/checkout@v6
        with: {repository: digital-twin-ph/example-2002-london-ozone, ref: 356884ab7796e50508b4ef3ca23e38a005963db4, fetch-depth: 0, path: example-london-checkout}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Place the pinned repositories beside this one
        run: |
          mv validation-lab-checkout ../validation-lab
          mv dive-deeper-checkout ../dive-deeper
          mv example-south-london-checkout ../example-1855-cholera-south-london
          mv example-oswego-checkout ../example-1940-oswego-church-supper
          mv example-nigeria-checkout ../example-2024-nigeria-immunization
          mv example-salmonella-checkout ../example-2021-salmonella-germany
          mv example-nyc-checkout ../example-2025-nyc-ozone
          mv example-london-checkout ../example-2002-london-ozone
      - run: npm run build
      - id: sentences
        name: Every sentence's numbers, with the satellite files read from Planetary Computer
        if: always()
        run: |
          set -o pipefail
          node scripts/sentence-numbers.mjs --strict 2>&1 | tee "$RUNNER_TEMP/sentences.log"
      - id: browser
        name: The browser tests, against the live services
        if: always()
        run: |
          set -o pipefail
          npx playwright test --project=chromium --reporter=list 2>&1 | tee "$RUNNER_TEMP/live.log"
      - name: Keep the failed tests' screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-check-results
          path: test-results/artifacts
          retention-days: 14
      - name: Say which tests failed, in an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          day=$(date -u +%F)
          body="$RUNNER_TEMP/issue.md"
          {
            echo "The weekly check against the live services failed on $day: $RUN"
            echo
            echo 'Failed, as the run listed them:'
            echo
            grep -E '✘' "$RUNNER_TEMP/live.log" 2>/dev/null | sed -E 's/^ *✘ *[0-9]+ /- /' | sort -u | head -40 || true
            if [ "${{ steps.sentences.outcome }}" = 'failure' ]; then
              echo '- validate:sentence-numbers, with the satellite files read live:'
              tail -20 "$RUNNER_TEMP/sentences.log" | sed 's/^/    /'
            fi
            echo
            echo 'The same tests pass in the local gate, which answers geoBoundaries from recorded copies, so a failure here is a change in an outside service, or a test that reaches one. Screenshots and traces are attached to the run.'
          } > "$body"
          open=$(gh issue list --state open --search 'in:title "Live services check failed"' --json number --jq '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" --body-file "$body"
          else gh issue create --title "Live services check failed ($day)" --body-file "$body"; fi
