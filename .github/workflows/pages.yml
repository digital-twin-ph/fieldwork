name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # PUBLISHING NO LONGER WAITS FOR VERIFICATION.
  #
  # Measured 2026-10-18: a push took 25-41 minutes to reach the site and 30.1 of those were
  # `npm run check` re-run here, against 0.1 minutes to publish. The practitioner was looking at a
  # site one or two commits behind whatever had just been fixed -- "these are changes I need to
  # see so if we make them, they are useless without human review" -- and a 31-minute lag between
  # a fix and the chance to review it is the review loop, not a detail of it.
  #
  # The gate still runs on every push, in `verify` below, and still goes red. It no longer stands
  # between a change and the person who has to judge it. What this costs: a failure that only
  # reproduces on a clean Linux runner now reaches the site for the ~30 minutes until verify
  # finishes. The gate is run locally before every push, and a typecheck and build still run here
  # before anything is published, so what is uncovered is narrower than it looks -- but it is not
  # nothing, and that is the trade.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Typecheck and bundle. Two seconds locally, and it is the one check that can tell whether
      # the thing about to be published is a working build at all.
      - run: npm run build
      - name: Stage browser assets and licenses
        run: node scripts/stage-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Serialised against itself only. Publishing is seconds, so a queue here costs nothing, and
    # cancelling a deploy mid-flight is how a site ends up serving half an artifact.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4

  # THE GATE, unchanged, in parallel with the deploy rather than in front of it.
  verify:
    runs-on: ubuntu-latest
    # Raised from 20 on 2026-10-14, after c316bc5 was cancelled at 20m16s. The suite grew: 490
    # unit tests and 220 browser tests across chromium and webkit, plus four validators added the
    # day before. A shared runner is slower than the machine this is developed on, where the same
    # gate takes about nine minutes.
    #
    # Raised rather than trimmed, and with headroom rather than to just past the last run: a
    # timeout set to the current duration converts the next few added tests into a cancelled
    # deploy that looks like an infrastructure flake. It is still a bound, so a genuine hang is
    # caught -- 40 minutes is roughly three times the honest duration.
    timeout-minutes: 40
    # A superseded verify is verifying a commit nobody is looking at any more, and two 30-minute
    # gates queued behind each other is how the old lag was built. The newest commit is the one
    # that gets checked; an older one that was cancelled is recorded as cancelled, not as green.
    concurrency:
      group: pages-verify
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
      # The widget manual and the Dive Deeper panel link one notebook per widget, and
      # validate-dive-deeper confirms each link reaches a section that exists by reading this
      # sibling. Checked out so the links are verified on every deploy rather than only where
      # someone happens to have the repository beside this one -- a notebook renamed there breaks
      # the links in a practitioner's browser and nowhere else.
      #
      # Public, so no token: the repository is digital-twin-ph/validation-lab, visibility public.
      #
      # At the commit widgets/parity.json pins, not at whatever its default branch holds today.
      # Those are not the same thing, and on 2026-10-14 they differed: a check and its notebook
      # were committed on a branch, the ledger pinned that commit, and the deploy failed here
      # because the default branch did not carry the notebook the ledger said it did. Pinning the
      # checkout means this job verifies the evidence the ledger CLAIMS rather than the evidence
      # a branch happens to hold, and a pin that has gone missing fails loudly instead of being
      # checked against something else.
      # jq rather than node: this step runs before setup-node, and the runner's own node is not
      # the version this project requires.
      - id: lab
        run: echo "commit=$(jq -r .lab.commit widgets/parity.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: digital-twin-ph/validation-lab
          ref: ${{ steps.lab.outputs.commit }}
          # A commit reachable from any branch, which a shallow default-branch clone would miss.
          fetch-depth: 0
          path: validation-lab-checkout
      # AND THE LESSONS, for the same reason and found the hard way. `validate:dive-deeper` reads
      # ../dive-deeper/content and refuses when it is absent, so every push to main since
      # 2026-10-20 has deployed with a red verify: "2 referenced, NONE verified -- dive-deeper is
      # not checked out beside this repository." The gate passed on the machine it was developed
      # on, where that repository happens to sit beside this one, and failed on a clean runner --
      # which is precisely the difference the verify job exists to find, reporting it for three
      # days before anyone read the log.
      #
      # Pinned the same way, because widgets/dive-deeper.json pins a commit under `repository`
      # and a link verified against whatever the default branch holds today is not verified
      # against the lesson the ledger claims.
      - id: deeper
        run: echo "commit=$(jq -r .repository.commit widgets/dive-deeper.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: digital-twin-ph/dive-deeper
          ref: ${{ steps.deeper.outputs.commit }}
          fetch-depth: 0
          path: dive-deeper-checkout
      # AND THE WORKED EXAMPLE, for the third time and for the same reason. The unit suite reads
      # ../example-1855-cholera-south-london/data/*.csv directly -- Table VIII, Table IX and
      # Table XII are the subject of the relate, melt, rate and contingency tests, which assert
      # against Snow's own published arithmetic rather than a fixture -- so on a clean runner
      # they fail with ENOENT, and every push since 2026-10-26 has deployed with a red verify.
      # The same clean-runner-versus-this-machine difference as the lab (2026-10-14) and the
      # lessons (2026-10-20), reported for three days before anyone read the log. It is written
      # down three times now: a test whose subject is a sibling repository needs that sibling
      # checked out here, or the gate is only ever green where the developer happens to stand.
      #
      # Public, so no token: digital-twin-ph/example-1855-cholera-south-london, visibility public.
      #
      # Pinned at the commit widgets/examples.json pins, read by repository rather than by index
      # so that a second pinned example cannot quietly take this checkout's place. The browser
      # catalog test serves these same bytes and verifies their digest, so an unpinned checkout
      # would be checked against something other than what the catalog claims.
      - id: example
        run: echo "commit=$(jq -r '.examples[] | select(.repository|endswith("/example-1855-cholera-south-london")) | .commit' widgets/examples.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: digital-twin-ph/example-1855-cholera-south-london
          ref: ${{ steps.example.outputs.commit }}
          fetch-depth: 0
          path: example-south-london-checkout
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Both engines the gate runs. WebKit is here because Tauri on macOS is WKWebView and
      # experiment 70 requires a WebKit gate before any desktop packaging decision.
      # The browser download is 40 seconds of every run and changes only when Playwright does, so
      # it is cached on the resolved version from the lockfile rather than on a hand-written one.
      # The system libraries --with-deps installs are NOT cached -- they go outside this path, and
      # install-deps is fast because apt has them.
      - name: Resolve the Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install --with-deps chromium webkit
        if: steps.browsers.outputs.cache-hit != 'true'
      # A cache hit still needs the system libraries, which live outside the cached path.
      - run: npx playwright install-deps chromium webkit
        if: steps.browsers.outputs.cache-hit == 'true'
      # The checkout lands inside the workspace; the scripts look for a sibling of this
      # repository, so it is moved up one level to where they expect it.
      - name: Place the validation lab beside this repository
        run: mv validation-lab-checkout ../validation-lab
      - name: Place the lessons beside this repository
        run: mv dive-deeper-checkout ../dive-deeper
      - name: Place the worked example beside this repository
        run: mv example-south-london-checkout ../example-1855-cholera-south-london
      - name: Type check, build and run regression tests
        run: npm run check
