name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      # The widget manual and the Dive Deeper panel link one notebook per widget, and
      # validate-dive-deeper confirms each link reaches a section that exists by reading this
      # sibling. Checked out so the links are verified on every deploy rather than only where
      # someone happens to have the repository beside this one -- a notebook renamed there breaks
      # the links in a practitioner's browser and nowhere else.
      #
      # Public, so no token: the repository is digital-twin-ph/validation-lab, visibility public.
      - uses: actions/checkout@v6
        with:
          repository: digital-twin-ph/validation-lab
          path: validation-lab-checkout
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Both engines the gate runs. WebKit is here because Tauri on macOS is WKWebView and
      # experiment 70 requires a WebKit gate before any desktop packaging decision.
      - run: npx playwright install --with-deps chromium webkit
      # The checkout lands inside the workspace; the scripts look for a sibling of this
      # repository, so it is moved up one level to where they expect it.
      - name: Place the validation lab beside this repository
        run: mv validation-lab-checkout ../validation-lab
      - name: Type check, build and run regression tests
        run: npm run check
      - name: Stage browser assets and licenses
        run: node scripts/stage-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
